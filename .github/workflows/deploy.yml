name: Deploy to GitHub Pages

# 前提：仓库 Settings → Pages → Source 选择 “GitHub Actions”。
# 推送 main/master（或手动触发）后自动构建并将 dist 发布到 GitHub Pages
# （官方 Pages artifact 流程，直接发布、不生成 gh-pages 分支）。

"on":
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # smoke 用全局 WebSocket 驱动 CDP，需要 Node 22+
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      # smoke 内含 build；离线承诺坏了就让部署失败——这是有意为之
      - run: npm run smoke

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
